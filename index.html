<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f2e9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e0c0a" media="(prefers-color-scheme: dark)" />
    <script>
      // 画面が一瞬ちがう色で出ないよう、描画前に選んだ配色を当てる（src/lib/theme.ts と同じ処理）
      try {
        var t = localStorage.getItem('theme')
        if (t === 'light' || t === 'dark') {
          document.documentElement.dataset.theme = t
          document.querySelectorAll('meta[name=theme-color]').forEach(function (m) {
            m.setAttribute('content', t === 'dark' ? '#0e0c0a' : '#f7f2e9')
          })
        }
      } catch (e) {}
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Today&#39;s Outfit" />
    <title>Today&#39;s Outfit</title>
    <!-- 筆記体・欧文セリフ・明朝。読めないときは端末のフォントで表示 -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&amp;display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&amp;family=Shippori+Mincho:wght@500;700&amp;display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
